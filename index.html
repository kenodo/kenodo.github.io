<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подключение</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e1e2f, #2b5876);
      font-family: Arial, sans-serif;
      color: white;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 320px;
    }

    h1 {
      margin-bottom: 20px;
      font-weight: 500;
      font-size: 20px;
    }

    button {
      width: 100%;
      padding: 15px 20px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    button:active {
      transform: scale(0.97);
    }

    .hint {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.7;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.8);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 2;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }


    .buttonApp{
      margin-top: 10px;
      background: linear-gradient(135deg, #d84ffe, #feb300);
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="container">
    <h1>Скопируй и импортируй в v2rayNG</h1>
    <button onclick="copyConfig()">Скопировать подключение</button>
    <button class="buttonApp" onclick="openApp()">Открыть в приложении</button>
    <div class="hint">Затем: v2rayNG → Import config → Paste</div>
  </div>

  <div id="toast" class="toast">Скопировано 👌</div>

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');

    let W, H;

function resize() {
  const dpr = window.devicePixelRatio || 1;

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const threshold = () => W * 0.5;

    
    const sources = [
      "icons/telegram.png",
      "icons/youtube.png",
      "icons/instagram.png",
      "icons/whatsapp.png",
      "icons/discord.png"
    ];

const images = [];

sources.forEach(src => {
  const img = new Image();
  img.src = src;
  images.push(img);
});

    window.addEventListener('resize', resize);
    resize();

    const icons = [];
    const COUNT = 40;

    for (let i = 0; i < COUNT; i++) {

      
      icons.push({
        x: Math.random() * W, // Используем W вместо canvas.width
        y: Math.random() * H, // Используем H вместо canvas.height
        speed: 0.5 + Math.random() * 0.7,
        size: 40,
        img: images[Math.floor(Math.random() * images.length)]
      });
    }



    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let icon of icons) {
        icon.x += icon.speed;
        if (icon.x > canvas.width + 50) {
          icon.x = -50;
          icon.y = Math.random() * canvas.height;
        }

        const t = (icon.x - threshold()) / 150; // 150 = ширина зоны перехода
        const k = Math.max(0, Math.min(1, t)); // clamp 0..1

        ctx.save();
        ctx.globalAlpha = 1;

        // grayscale
        ctx.filter = "grayscale(1)";
        ctx.drawImage(icon.img, icon.x, icon.y, icon.size, icon.size);
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = k; // вот он, плавный переход
        ctx.filter = "none";

        ctx.drawImage(icon.img, icon.x, icon.y, icon.size, icon.size);
        ctx.restore();

       
      }

      requestAnimationFrame(draw);
    }

    draw();

    // base64 обфускация
    
    const encoded = "dmxlc3M6Ly8yNDA0MTFhYy1jNjUwLTRiY2UtOGE4Ny0wMTQzYWY2ZWI3NTZANDYuMTQ5LjY2LjQ4OjQ0Mz9zZWN1cml0eT1yZWFsaXR5JnNuaT1hcGkuZW5vdGVzLnBybyZmcD1jaHJvbWUmcGJrPWNaNmJiQ1pZTzlObDNkakVTOHFxNFYySXFDUHJmRkFjaXVJVExYQzlMUXMmc2lkPWE4JnNweD0vJnR5cGU9Z3JwYyZlbmNyeXB0aW9uPW5vbmUjdGltZXdlYi1ydQ==";
    const encodedDeep = "djJyYXluZzovL2luc3RhbGwtY29uZmlnLz91cmw9dmxlc3MlM0ElMkYlMkYyNDA0MTFhYy1jNjUwLTRiY2UtOGE4Ny0wMTQzYWY2ZWI3NTYlNDA0Ni4xNDkuNjYuNDglM0E0NDMlM0ZzZWN1cml0eSUzRHJlYWxpdHklMjZzbmklM0RhcGkuZW5vdGVzLnBybyUyNmZwJTNEY2hyb21lJTI2cGJrJTNEY1o2YmJDWllPOU5sM2RqRVM4cXE0VjJJcUNQcmZGQWNpdUlUTFhDOUxRcyUyNnNpZCUzRGE4JTI2c3B4JTNEJTJGJTI2dHlwZSUzRGdycGMlMjZlbmNyeXB0aW9uJTNEbm9uZSUyM3RpbWV3ZWItcnU=";
  
  
    function decode(str) {
      return atob(str);
    }

    function showToast() {
      const t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1500);
    }


    function openApp() {
      const url = atob(encodedDeep);

      // пробуем открыть
      window.location.href = url;

      // fallback если не сработало
      setTimeout(() => {
        showToast("Не удалось открыть. Попробуй вручную или скопируй.");
      }, 1500);
    }

    async function copyConfig() {
      const text = decode(encoded);

      try {
        await navigator.clipboard.writeText(text);
        showToast();
      } catch (e) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast();
      }
    }
  </script>
</body>
</html>
