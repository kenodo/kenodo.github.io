<!DOCTYPE html>

<head>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e1e2f, #2b5876);
      font-family: Arial, sans-serif;
      color: white;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 320px;
    }

    h1 {
      margin-bottom: 20px;
      font-weight: 500;
      font-size: 20px;
    }

    button {
      width: 100%;
      padding: 15px 20px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    button:active {
      transform: scale(0.97);
    }

    .hint {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.7;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.8);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 2;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }


    .buttonApp{
      margin-top: 10px;
      background: linear-gradient(135deg, #d84ffe, #feb300);
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="container">
    <h1>Обновление конфига</h1>
    <!--<button onclick="copyConfig()">Скопировать подключение</button> -->
    <button class="buttonApp" onclick="openApp()">Открыть в приложении</button>
    <!--<div class="hint">Затем: v2rayNG → Import config → Paste</div>!-->
  </div>

  <div id="toast" class="toast">Скопировано 👌</div>

  <script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d'); // Оптимизация: отключаем прозрачность самого холста, если фон залит градиентом в CSS

let W, H, dpr;
const icons = [];
const COUNT = 30;
const images = [];
const sources = [
  "icons/telegram.png", "icons/youtube.png", "icons/instagram.png", "icons/whatsapp.png", "icons/discord.png"
];

// Функция для создания ч/б версии изображения
function createGrayScale(img) {
  const offCanvas = document.createElement('canvas');
  const offCtx = offCanvas.getContext('2d');
  offCanvas.width = 40;
  offCanvas.height = 40;
  offCtx.filter = 'grayscale(1)';
  offCtx.drawImage(img, 0, 0, 40, 40);
  return offCanvas; // Возвращаем канвас как готовый Bitmap
}

async function init() {
  // Загружаем изображения
  const loadPromises = sources.map(src => {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        // Кэшируем сразу оба варианта
        const gray = createGrayScale(img);
        resolve({ color: img, gray: gray });
      };
      img.src = src;
    });
  });

  const loadedImages = await Promise.all(loadPromises);
  
  resize();

  for (let i = 0; i < COUNT; i++) {
    const imgSet = loadedImages[Math.floor(Math.random() * loadedImages.length)];
    icons.push({
      x: Math.random() * W,
      y: Math.random() * H,
      speed: 0.5 + Math.random() * 0.7,
      size: 40,
      imgColor: imgSet.color,
      imgGray: imgSet.gray
    });
  }
  draw();
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  // Скейлим контекст один раз, чтобы не умножать координаты в draw
  ctx.scale(dpr, dpr);
}

window.addEventListener('resize', resize);

function draw() {
  // Очистка (можно оптимизировать до fillRect, если нет прозрачности)
  ctx.clearRect(0, 0, W, H);

  const thresh = W * 0.5;

  for (let icon of icons) {
    icon.x += icon.speed;
    if (icon.x > W + 40) {
      icon.x = -40;
      icon.y = Math.random() * H;
    }

    const t = (icon.x - thresh) / 150;
    const k = Math.max(0, Math.min(1, t));

    // Рисуем базовую (серую) иконку
    ctx.globalAlpha = 1;
    ctx.drawImage(icon.imgGray, icon.x, icon.y, icon.size, icon.size);

    // Если иконка перешла порог, рисуем цветную поверх с прозрачностью
    if (k > 0) {
      ctx.globalAlpha = k;
      ctx.drawImage(icon.imgColor, icon.x, icon.y, icon.size, icon.size);
    }
  }

  requestAnimationFrame(draw);
}

init();

    function decode(str) {
      return atob(str);
    }

    function showToast() {
      const t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1500);
    }


    function openApp() {
      const url = atob(encodedDeep);

      // пробуем открыть
      window.location.href = url;

      // fallback если не сработало
      setTimeout(() => {
        showToast("Не удалось открыть. Попробуй вручную или скопируй.");
      }, 1500);
    }

    async function copyConfig() {
      const text = decode(encoded);

      try {
        await navigator.clipboard.writeText(text);
        showToast();
      } catch (e) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast();
      }
    }
